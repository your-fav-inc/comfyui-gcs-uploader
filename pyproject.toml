[project]
name = "comfyui-gcs-uploader"
version = "0.1.0"
description = "ComfyUI custom node that uploads generated images to Google Cloud Storage via pre-signed PUT URLs and returns the object keys as node output."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
# Everything below already ships with ComfyUI; listed for standalone testing.
dependencies = ["numpy", "Pillow", "requests"]

[tool.comfy]
PublisherId = "playdesire"
DisplayName = "GCS Uploader (signed URL)"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package root has an __init__.py (ComfyUI convention); importlib mode keeps pytest from
# treating the repo itself as a package and tripping over the relative import.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["E501"]
